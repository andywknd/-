<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Докопаться до Америки</title>
<meta name="description" content="Пока все обсуждают — ты копаешь. Прокопай тоннель от Чукотки до Аляски.">
<meta property="og:title" content="Докопаться до Америки">
<meta property="og:description" content="Пока все обсуждают — ты копаешь.">
<meta property="og:image" content="assets/promo.jpg">
<link rel="icon" href="assets/avatar_small.png">
<script src="https://telegram.org/js/telegram-web-app.js?59"></script>
<style>
:root{
  --bg:#0b1620; --panel:#13232f; --panel2:#1b3140; --line:#2a4556; --text:#eef6fa; --muted:#9db4c2;
  --accent:#ff9d2e; --accent2:#ffcf4a; --good:#4ee08a; --bad:#ff5a5a; --water:#3fa8ff; --gas:#7dff6a;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --tgt:var(--tg-content-safe-area-inset-top,0px); --tgst:var(--tg-safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overflow:hidden;touch-action:none;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;cursor:pointer}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
.top-pad{padding-top:calc(max(var(--sat), calc(var(--tgt) + var(--tgst))) + 6px)}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;padding:8px 10px 0;pointer-events:none;z-index:5}
#hudrow{display:flex;gap:6px;align-items:stretch}
.bar{flex:1;min-width:0;background:rgba(8,18,26,.78);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:4px 6px 5px;backdrop-filter:blur(4px)}
.bar .lbl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);line-height:1.2;white-space:nowrap;gap:3px}
.bar .lbl b{color:var(--text);font-weight:700}
.bar .trk{height:6px;border-radius:4px;background:rgba(255,255,255,.12);margin-top:3px;overflow:hidden}
.bar .fill{height:100%;border-radius:4px;transition:width .2s}
.bar.warn{border-color:#ffb02e;animation:pulse 1s infinite}
.bar.crit{border-color:var(--bad);animation:pulse .5s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 2px rgba(255,90,90,.35)}}
#hudrow2{display:flex;gap:6px;margin-top:6px;align-items:center}
.chip{background:rgba(8,18,26,.78);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:4px 8px;font-size:12px;font-weight:700;white-space:nowrap}
#strip{flex:1;height:26px;position:relative;background:rgba(8,18,26,.78);border:1px solid rgba(255,255,255,.08);border-radius:10px;pointer-events:auto;overflow:hidden}
#strip canvas{width:100%;height:100%;display:block}
#warnline{margin-top:6px;text-align:center;font-size:12.5px;font-weight:700;color:#ffd27a;text-shadow:0 1px 2px #000;min-height:16px}
#menuBtn{pointer-events:auto;width:34px;height:28px;border-radius:9px;background:rgba(8,18,26,.78);border:1px solid rgba(255,255,255,.1);font-size:16px;line-height:1}

/* Реплики */
#say{position:fixed;left:10px;right:10px;z-index:6;display:flex;gap:8px;align-items:flex-end;pointer-events:auto;transition:opacity .3s,transform .3s}
#say.off{opacity:0;transform:translateY(-8px);pointer-events:none}
#say img{width:54px;height:54px;border-radius:12px;background:#264050;object-fit:cover;flex:none;border:2px solid rgba(255,255,255,.15)}
#say .bub{background:rgba(250,250,245,.96);color:#1a2830;border-radius:12px 12px 12px 4px;padding:7px 10px;font-size:13.5px;line-height:1.3;box-shadow:0 4px 14px rgba(0,0,0,.35)}
#say .bub small{display:block;font-weight:700;color:#b25d00;font-size:11px;margin-bottom:1px}

/* Управление */
#controls{position:fixed;left:0;right:0;bottom:0;height:46%;z-index:4;pointer-events:none}
#joyzone{position:absolute;left:0;bottom:0;width:62%;height:100%;pointer-events:auto}
#joy{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,190,90,.75);box-shadow:0 2px 8px rgba(0,0,0,.4)}
#joyhint{position:absolute;left:18px;bottom:calc(var(--sab) + 18px);font-size:12px;color:rgba(255,255,255,.55);pointer-events:none}
#btns{position:absolute;right:12px;bottom:calc(var(--sab) + 14px);display:flex;flex-direction:column;gap:9px;align-items:flex-end;pointer-events:auto}
.rb{width:58px;height:58px;border-radius:50%;background:rgba(10,24,34,.82);border:2px solid rgba(255,255,255,.18);font-size:24px;position:relative;box-shadow:0 3px 10px rgba(0,0,0,.35)}
.rb small{position:absolute;right:-2px;bottom:-2px;background:var(--accent);color:#1b1205;border-radius:9px;font-size:11px;font-weight:800;min-width:18px;height:18px;line-height:18px;padding:0 4px}
.rb.dim{opacity:.35}
.rb .cd{position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(0,0,0,.6) var(--p,0%),transparent 0)}
#rowc{display:flex;gap:8px}
#rowc .rb{width:46px;height:46px;font-size:19px}
#baseBtn{width:auto;height:50px;border-radius:25px;padding:0 18px;background:linear-gradient(180deg,#ffb54a,#ff8a1f);color:#2a1300;font-weight:800;font-size:16px;border:0;animation:bob 1.2s infinite}
@keyframes bob{50%{transform:translateY(-3px)}}

/* Панели */
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88%;z-index:20;background:var(--panel);border-radius:18px 18px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.5);display:flex;flex-direction:column;padding-bottom:var(--sab)}
.sheet header{display:flex;align-items:center;gap:8px;padding:12px 14px 8px;border-bottom:1px solid var(--line)}
.sheet header h2{margin:0;font-size:18px;flex:1}
.sheet .x{width:34px;height:34px;border-radius:50%;background:var(--panel2);font-size:18px}
.sheet .body{overflow-y:auto;padding:10px 12px 16px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.sec{background:var(--panel2);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.sec h3{margin:0 0 8px;font-size:14px;color:var(--accent2);display:flex;justify-content:space-between;align-items:center}
.row{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid rgba(255,255,255,.06);font-size:14px}
.row:first-of-type{border-top:0}
.row .grow{flex:1;min-width:0}
.row .sub{font-size:12px;color:var(--muted)}
.btn{background:linear-gradient(180deg,#ffb54a,#ff8a1f);color:#2a1300;font-weight:800;border-radius:11px;padding:9px 13px;font-size:14px;white-space:nowrap}
.btn.sec2{background:#2c4a5c;color:var(--text)}
.btn.good{background:linear-gradient(180deg,#6af0a0,#2fbf6a);color:#04210f}
.btn:disabled{opacity:.4;filter:grayscale(.6)}
.btn.wide{width:100%;padding:12px;font-size:15px;margin-top:6px}
.ok{color:var(--good)} .no{color:var(--bad)}
.pips{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}
.pips i{width:9px;height:9px;border-radius:3px;background:rgba(255,255,255,.15)}
.pips i.on{background:var(--accent)}
.summary{background:#203a2c;border:1px solid #2f6b48;border-radius:12px;padding:9px 11px;font-size:13.5px;margin-bottom:10px;line-height:1.4}

/* Экраны */
.screen{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column}
#title{background:#0b1620 url(assets/title_bg.webp) center/cover no-repeat;align-items:center;justify-content:space-between;padding-bottom:calc(var(--sab) + 26px)}
#title .logo{text-align:center;margin-top:7vh;padding:0 16px}
#title .logo h1{margin:0;font-size:clamp(30px,10vw,52px);line-height:.95;font-weight:900;letter-spacing:.5px;color:#fff;text-shadow:0 3px 0 #0f2a3a,0 0 18px rgba(0,0,0,.55);-webkit-text-stroke:1.5px #0f2a3a;text-transform:uppercase}
#title .logo p{margin:10px 0 0;font-weight:700;font-size:15px;color:#fff;text-shadow:0 1px 4px #000}
#title .menu{width:min(340px,86%);display:flex;flex-direction:column;gap:10px}
#title .menu .btn{font-size:18px;padding:15px}
#title .prog{background:rgba(8,18,26,.82);border-radius:14px;padding:10px 12px;font-size:13.5px;text-align:center;line-height:1.4}
#title .disc{font-size:10.5px;color:rgba(255,255,255,.75);text-align:center;text-shadow:0 1px 2px #000;padding:0 12px}

.modal{position:fixed;inset:0;z-index:40;background:rgba(3,8,12,.66);display:flex;align-items:center;justify-content:center;padding:18px}
.modal .card{background:var(--panel);border-radius:18px;max-width:420px;width:100%;padding:16px;box-shadow:0 16px 50px rgba(0,0,0,.6);max-height:90%;overflow:auto}
.modal h2{margin:0 0 8px;font-size:20px}
.modal p{margin:6px 0;font-size:14.5px;line-height:1.45;color:#d7e6ee}
.modal .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.modal .acts .btn{flex:1}

#dialog{position:fixed;inset:0;z-index:45;background:rgba(3,8,12,.55);display:flex;align-items:flex-end;justify-content:center;padding:14px 12px calc(var(--sab) + 18px)}
#dialog .dl{display:flex;gap:10px;align-items:flex-end;max-width:520px;width:100%}
#dialog img{width:96px;height:96px;object-fit:contain;flex:none;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}
#dialog .bub{flex:1;background:#fbfaf3;color:#1a2830;border-radius:16px 16px 16px 4px;padding:11px 13px;font-size:15.5px;line-height:1.4;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#dialog .bub small{display:block;color:#b25d00;font-weight:800;font-size:12px;margin-bottom:2px}
#dialog .bub .tap{display:block;text-align:right;font-size:11px;color:#8b9aa3;margin-top:4px}
#chapterBanner{position:fixed;left:0;right:0;top:34%;z-index:12;text-align:center;pointer-events:none;transition:opacity .6s}
#chapterBanner .k{font-size:13px;letter-spacing:2px;color:var(--accent2);font-weight:800;text-shadow:0 2px 4px #000}
#chapterBanner .t{font-size:28px;font-weight:900;text-shadow:0 3px 8px #000;padding:0 20px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.cell{background:#10202b;border-radius:12px;padding:8px;text-align:center;font-size:11.5px;line-height:1.25;min-height:86px}
.cell .ic{font-size:28px;height:34px;display:flex;align-items:center;justify-content:center}
.cell.lock{opacity:.4}
.gem{width:26px;height:26px;transform:rotate(45deg);border-radius:4px;box-shadow:0 0 10px currentColor}

#toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:50;background:rgba(8,18,26,.92);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:9px 14px;font-weight:700;font-size:14px;pointer-events:none;transition:opacity .3s;text-align:center;max-width:86%}
#toast.off{opacity:0}
#floaters{position:fixed;inset:0;pointer-events:none;z-index:8}
.fl{position:absolute;font-weight:900;font-size:15px;text-shadow:0 2px 3px #000;animation:fl 1.1s forwards;white-space:nowrap}
@keyframes fl{to{transform:translateY(-46px);opacity:0}}
#finale canvas{width:100%;height:46%;display:block}
.sharebox{background:#0f1d27;border-radius:14px;padding:12px;font-size:14px;line-height:1.5;border:1px dashed #3a5a6d;margin:8px 0}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid rgba(255,255,255,.06);font-size:14.5px}
.toggle input{width:44px;height:24px;accent-color:var(--accent)}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div id="hudrow">
    <div class="bar" id="b-fuel"><div class="lbl"><span>⛽ Топливо</span><b>0</b></div><div class="trk"><div class="fill" style="background:#ffb02e"></div></div></div>
    <div class="bar" id="b-heat"><div class="lbl"><span>🌡 Нагрев</span><b>0</b></div><div class="trk"><div class="fill" style="background:#ff6b3d"></div></div></div>
    <div class="bar" id="b-hull"><div class="lbl"><span>🛡 Корпус</span><b>0</b></div><div class="trk"><div class="fill" style="background:#4ee08a"></div></div></div>
    <div class="bar" id="b-cargo"><div class="lbl"><span>📦 Груз</span><b>0</b></div><div class="trk"><div class="fill" style="background:#57b8ff"></div></div></div>
  </div>
  <div id="hudrow2">
    <div class="chip" id="coins">🪙 0</div>
    <div id="strip"><canvas id="stripc"></canvas></div>
    <div class="chip" id="pct">0%</div>
    <button id="menuBtn" aria-label="Меню">☰</button>
  </div>
  <div id="warnline"></div>
</div>

<div id="say" class="off"><img alt=""><div class="bub"><small></small><span></span></div></div>

<div id="controls" class="hidden">
  <div id="joyzone"><div id="joy" class="hidden"><div id="knob"></div></div><div id="joyhint">Веди пальцем — бур копает</div></div>
  <div id="btns">
    <button id="baseBtn" class="rb hidden">🏠 База</button>
    <div id="rowc">
      <button class="rb" id="c-can" aria-label="Канистра">⛽<small>0</small></button>
      <button class="rb" id="c-rep" aria-label="Ремкомплект">🔧<small>0</small></button>
      <button class="rb" id="c-cool" aria-label="Охлаждение">❄️<small>0</small></button>
    </div>
    <button class="rb" id="scanBtn" aria-label="Сканер">📡<div class="cd"></div></button>
  </div>
</div>

<div id="chapterBanner" style="opacity:0"><div class="k"></div><div class="t"></div></div>
<div id="floaters"></div>
<div id="toast" class="off"></div>

<!-- Титульный экран -->
<div id="title" class="screen top-pad">
  <div class="logo">
    <h1>Докопаться<br>до Америки</h1>
    <p>Пока все обсуждают — ты копаешь</p>
  </div>
  <div class="menu">
    <div class="prog" id="tprog">Чукотка → Аляска. Тоннель: 0%</div>
    <button class="btn" id="playBtn">▶ Копать</button>
    <div style="display:flex;gap:10px">
      <button class="btn sec2" style="flex:1" id="collBtnT">💎 Коллекция</button>
      <button class="btn sec2" style="flex:1" id="setBtnT">⚙️ Настройки</button>
    </div>
    <div class="disc">Сатирическая игра. Все персонажи, реплики и события вымышлены; игра не связана с участниками реальных проектов.</div>
  </div>
</div>

<div id="sheet" class="sheet hidden"><header><h2 id="sheetTitle"></h2><button class="x" id="sheetX">✕</button></header><div class="body" id="sheetBody"></div></div>
<div id="modal" class="modal hidden"><div class="card" id="modalCard"></div></div>
<div id="dialog" class="hidden"><div class="dl"><img alt=""><div class="bub"><small></small><span></span><i class="tap">нажми, чтобы продолжить ›</i></div></div></div>
<div id="finale" class="screen hidden" style="background:#0b1620"><canvas id="finc"></canvas><div class="body" id="finBody" style="padding:12px 14px calc(var(--sab) + 16px);overflow:auto;flex:1;touch-action:pan-y"></div></div>

<script src="config.js?v=3"></script>
<script src="shop-links.js?v=3"></script>
<script src="game.js?v=3"></script>
</body>
</html>
